<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 720">
  <!-- Paleta del cielo y resplandor que ilumina el portal. -->
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#293c36"/>
      <stop offset="1" stop-color="#8ba57a"/>
    </linearGradient>
    <linearGradient id="glow" x2="0" y2="1">
      <stop stop-color="#E3D15B" stop-opacity=".85"/>
      <stop offset="1" stop-color="#E3D15B" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Cielo, luna y cordilleras del paisaje fantástico. -->
  <rect width="1500" height="720" fill="url(#sky)"/>
  <circle cx="1130" cy="170" r="95" fill="#E3D15B" opacity=".8"/>
  <path d="M0 460 190 300l170 140 210-240 250 250 200-185 240 210 135-135 105 93v287H0z" fill="#405846"/>
  <path d="M0 530 240 370l205 180 190-160 250 170 220-235 200 195 195-110v310H0z" fill="#25372f"/>
  <!-- Portal brillante al fondo, montañas en primer plano y puntos de estrellas. -->
  <path d="M620 720V420c0-100 58-180 130-180s130 80 130 180v300z" fill="url(#glow)" opacity=".8"/>
  <path d="M660 720V430c0-70 40-128 90-128s90 58 90 128v290z" fill="#E3D15B" opacity=".76"/>
  <path d="M0 610c180-65 280 15 430-5s270-74 420-20 240 60 360 6 205-32 290 5v124H0z" fill="#17271f" opacity=".82"/>
  <g fill="#FBFAF5" opacity=".8">
    <circle cx="245" cy="120" r="3"/><circle cx="395" cy="220" r="2"/><circle cx="560" cy="110" r="2"/>
    <circle cx="900" cy="100" r="3"/><circle cx="1320" cy="340" r="2"/><circle cx="1040" cy="270" r="2"/>
  </g>
</svg>
